# ==============================================================================
# Server Configuration
# ==============================================================================
# Render injects the PORT environment variable; fall back to SERVER_PORT for
# local/manual runs, then to the conventional 8080 default.
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# ==============================================================================
# PostgreSQL Database Configuration (Local Development)
# Environment variables override defaults; never commit production passwords.
# ==============================================================================
paymesh.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upimesh}
paymesh.datasource.username=${SPRING_DATASOURCE_USERNAME:}
paymesh.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.url=${paymesh.datasource.url}
spring.datasource.username=${paymesh.datasource.username}
spring.datasource.password=${paymesh.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Conservative connection-pool settings for a small free-tier deployment.
# Neon Free tier closes idle connections after 5 minutes, so keep the pool
# small and refresh connections well before that timeout.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# One shared demo account. Supply both values through the environment; no credentials
# are included in this file. This is a portfolio demo access gate, not user identity.
paymesh.demo.username=${PAYMESH_DEMO_USERNAME:}
paymesh.demo.password=${PAYMESH_DEMO_PASSWORD:}
paymesh.demo.writes-enabled=${PAYMESH_DEMO_WRITES_ENABLED:true}
paymesh.api-write-limit-per-minute=${PAYMESH_API_WRITE_LIMIT_PER_MINUTE:60}

# ==============================================================================
# JPA / Hibernate Configuration
# Schema management set strictly to 'validate' - DDL is managed by Flyway.
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Database Migrations (Flyway)
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# Logging
# ==============================================================================
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ==============================================================================
# Mesh Simulator & Ingestion Settings
# ==============================================================================
# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window - packets older than this are rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Optional persistent RSA key for public deployment
paymesh.rsa.private-key-base64=${PAYMESH_RSA_PRIVATE_KEY_BASE64:}
paymesh.rsa.require-persistent-key=${PAYMESH_REQUIRE_PERSISTENT_RSA_KEY:false}
