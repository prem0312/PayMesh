# Render routes traffic to the container on all interfaces.
server.address=0.0.0.0

# Public deployment profile: fail closed if persistent key material is missing.
paymesh.rsa.require-persistent-key=${PAYMESH_REQUIRE_PERSISTENT_RSA_KEY:true}

# Public portfolio instances are read-only unless write access is deliberately enabled.
paymesh.demo.writes-enabled=${PAYMESH_DEMO_WRITES_ENABLED:false}
paymesh.demo.public-dashboard=${PAYMESH_PUBLIC_DASHBOARD:true}

# Do not include exception details in the default error response.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Render structured console logs for hosted deployments.
logging.structured.format.console=logstash

paymesh.api-write-limit-per-minute=${PAYMESH_API_WRITE_LIMIT_PER_MINUTE:30}
