# ==============================================================================
# Dedicated Test Configuration (H2 In-Memory with PostgreSQL Compatibility)
# Used for isolated automated testing without requiring external infrastructure.
# ==============================================================================
# Use an internal property for the actual URL to shield it from being overridden
# by the SPRING_DATASOURCE_URL environment variable via Relaxed Binding.
paymesh.datasource.url=jdbc:h2:mem:upimesh_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
paymesh.datasource.username=sa
paymesh.datasource.password=

spring.datasource.url=${paymesh.datasource.url}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${paymesh.datasource.username}
spring.datasource.password=${paymesh.datasource.password}

# Test-only HTTP Basic credentials for API security integration tests.
#
# Use the same ${VAR:default} pattern as production so the test profile is
# not silently broken by a PAYMESH_DEMO_USERNAME / PAYMESH_DEMO_PASSWORD
# environment variable inherited from the developer shell. When the
# variables are unset, the defaults below apply and match WebSecurityIntegrationTest.
paymesh.demo.username=${PAYMESH_DEMO_USERNAME:test-demo}
paymesh.demo.password=${PAYMESH_DEMO_PASSWORD:test-demo-password}

# Schema validated against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations execute against H2 in PostgreSQL mode
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.demo.upimesh=INFO

# Mesh & Ingestion configuration
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
